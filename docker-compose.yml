# Local infrastructure for development. The app and worker run on the host (npm run dev:all).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wakeel
      POSTGRES_PASSWORD: wakeel
      POSTGRES_DB: wakeel_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
  # Optional: production-like adapters (set STORAGE_DRIVER=s3, MAIL_DRIVER=smtp, SCANNER_DRIVER=clamd)
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: wakeel, MINIO_ROOT_PASSWORD: wakeel-secret }
    ports: ["9000:9000", "9001:9001"]
    profiles: ["prodlike"]
  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["1025:1025", "8025:8025"]
    profiles: ["prodlike"]
  clamav:
    image: clamav/clamav:1.4
    ports: ["3310:3310"]
    profiles: ["prodlike"]
volumes:
  pgdata:
